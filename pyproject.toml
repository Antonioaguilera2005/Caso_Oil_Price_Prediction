[project]
name = "aa-case-02-oil-price-prediction"
version = "0.1.0"
description = "Predicción del Brent con redes recurrentes: datos temporales, validación, evaluación histórica y aplicación web."
authors = [
    {name = "Antonio Aguilera"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy (==2.5.4)",
    "pandas (>=3.1.0,<4.0.0)",
    "beautifulsoup4 (==4.15.0)",
    "yfinance (>=1.8.0,<2.0.0)",
    "torch (==2.15.0)",
    "streamlit (==1.67.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
package-mode = false

[dependency-groups]
analysis = [
    "matplotlib (==3.11.2)",
    "optuna (==5.1.0)",
    "ipykernel (>=7.4.0,<8.0.0)",
    "nbclient (>=0.11.0,<0.12.0)",
    "nbformat (==5.11.1)",
    "python-pptx (==1.0.2)"
]
