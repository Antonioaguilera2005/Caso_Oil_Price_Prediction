name: Verificar entrega

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Construir HTML sin instalar dependencias
        run: python -S -m scripts.build_app
      - name: Comprobar pesos, snapshots y cifras publicadas
        run: python -S -m scripts.verify_release --require-build
      - name: Comprobar motor de inferencia del navegador
        run: node --test app_site/engine.test.mjs
